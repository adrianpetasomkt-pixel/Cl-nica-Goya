<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1417" />

    <!--
      ATENÇÃO — TODO O SEO CRÍTICO VIVE NESTE ARQUIVO, ESTÁTICO.
      O React renderiza no cliente; nada abaixo pode ser injetado por
      JavaScript, senão crawler e preview de link não enxergam.

      Os marcadores {{PENDENTE: ...}} abaixo PRECISAM ser substituídos antes
      da publicação. Ver PENDENCIAS.md.
    -->

    <title>Rizzit Odontologia Premium — Clínica odontológica no Jardim Cuiabá, Cuiabá (MT)</title>
    <meta
      name="description"
      content="Rizzit Odontologia Premium: clínica odontológica na Rua das Dálias, 582, Jardim Cuiabá, Cuiabá (MT). Em atividade desde 2021. Agende pelo telefone (65) 98150-6894."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="geo.region" content="BR-MT" />
    <meta name="geo.placename" content="Cuiabá" />
    <!--
      A tag <link rel="canonical"> só entra quando o domínio for definido. Um
      canonical apontando para valor inválido é pior que canonical nenhum — o
      Google pode desconsiderar a página inteira. Descomente e preencha:
      {{PENDENTE: URL final do site (domínio contratado), para a tag canonical}}
      <link rel="canonical" href="https://DOMINIO-REAL/" />
    -->

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rizzit Odontologia Premium" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Rizzit Odontologia Premium — Jardim Cuiabá, Cuiabá (MT)" />
    <meta
      property="og:description"
      content="Clínica odontológica na Rua das Dálias, 582, Jardim Cuiabá, Cuiabá (MT). Em atividade desde 2021."
    />
    <meta property="og:url" content="{{PENDENTE: URL final do site (domínio contratado)}}" />
    <!--
      A imagem de compartilhamento sai de `npm run imagens` em /fotos/og.jpg,
      a partir da foto da recepção — que ainda não existe. Enquanto não houver
      foto real da clínica, NÃO apontamos og:image para a arte conceitual: a
      prévia no WhatsApp seria um gradiente abstrato, que não diz nada sobre a
      clínica e ainda dá a impressão de site inacabado.
    -->
    <meta
      property="og:image"
      content="{{PENDENTE: foto da recepção + domínio contratado, para gerar a imagem de compartilhamento em /fotos/og.jpg}}"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rizzit Odontologia Premium — Jardim Cuiabá, Cuiabá (MT)" />
    <meta
      name="twitter:description"
      content="Clínica odontológica na Rua das Dálias, 582, Jardim Cuiabá, Cuiabá (MT). Em atividade desde 2021."
    />

    <!--
      JSON-LD — schema.org/Dentist

      NÃO INCLUI aggregateRating, DE PROPÓSITO: não temos nota nem quantidade
      de avaliações. Marcar nota inventada é, além de mentira, motivo de
      penalização nas diretrizes de rich results do Google.

      NÃO INCLUI makesOffer / medicalSpecialty: nenhum tratamento foi
      confirmado.

      `geo`, `openingHoursSpecification` e `url` carregam marcadores. O JSON é
      válido, mas esses campos precisam de valor real antes da publicação.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Dentist",
        "name": "Rizzit Odontologia Premium",
        "legalName": "RIZZIT ODONTOLOGIA PREMIUM LTDA",
        "description": "Clínica odontológica no Jardim Cuiabá, em Cuiabá (MT), em atividade desde 2021.",
        "url": "{{PENDENTE: URL final do site (domínio contratado)}}",
        "telephone": "+55 65 98150-6894",
        "foundingDate": "2021-04-08",
        "taxID": "41.500.681/0001-34",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Rua das Dálias, 582 — Quadra 51, Lote 03",
          "addressLocality": "Cuiabá",
          "addressRegion": "MT",
          "postalCode": "78043-152",
          "addressCountry": "BR"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": "{{PENDENTE: latitude da clínica em graus decimais}}",
          "longitude": "{{PENDENTE: longitude da clínica em graus decimais}}"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "{{PENDENTE: dias de atendimento}}",
            "opens": "{{PENDENTE: horário de abertura}}",
            "closes": "{{PENDENTE: horário de fechamento}}"
          }
        ],
        "sameAs": ["https://www.instagram.com/rizzitodonto/"],
        "areaServed": [
          { "@type": "City", "name": "Cuiabá" },
          { "@type": "AdministrativeArea", "name": "Mato Grosso" }
        ]
      }
    </script>

    <!--
      Fontes auto-hospedadas: nenhuma requisição a terceiro antes da primeira
      pintura. As duas são necessárias na primeira dobra, então vão em preload.
    -->
    <link
      rel="preload"
      href="/fonts/fraunces-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Sem JavaScript o React não renderiza. O essencial — quem é, onde fica e
      como falar — precisa continuar disponível. Só dado confirmado aqui.
    -->
    <noscript>
      <div style="font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1.25rem; color: #14181B; line-height: 1.6">
        <h1 style="font-size: 1.5rem">Rizzit Odontologia Premium</h1>
        <p>Clínica odontológica no Jardim Cuiabá, em Cuiabá (MT). Em atividade desde 2021.</p>
        <p>
          <strong>Telefone:</strong>
          <a href="tel:+5565981506894" style="color: #8A5E2A">(65) 98150-6894</a>
        </p>
        <address style="font-style: normal">
          Rua das Dálias, 582 — Quadra 51, Lote 03, Jardim Cuiabá, Cuiabá — MT, CEP 78043-152
        </address>
        <p>Esta página funciona melhor com JavaScript ativado.</p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
